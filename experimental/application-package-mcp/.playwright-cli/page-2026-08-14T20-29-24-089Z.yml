    - generic [ref=f1e89]: The real workflow
    - heading "Four simple steps. Your files never leave your laptop." [level=2] [ref=f1e90]
    - paragraph [ref=f1e91]: The local agent manages the work in your own folder. The public service cannot browse it; it only receives a privacy-safe structure check or text you actively choose to review.
    - generic "Four-step application workflow" [ref=f1e92]:
      - article [ref=f1e93]:
        - generic [ref=f1e94]: "01"
        - heading "Check the workspace" [level=3] [ref=f1e95]
        - paragraph [ref=f1e96]: The local SOP checks folder health, updates, and anything that may be making an old workspace slow.
      - article [ref=f1e97]:
        - generic [ref=f1e98]: "02"
        - heading "Add your evidence" [level=3] [ref=f1e99]
        - paragraph [ref=f1e100]: Bring your CV, role or job description, personal work bullets, and any writing samples that sound like you.
      - article [ref=f1e101]:
        - generic [ref=f1e102]: "03"
        - heading "Tailor locally" [level=3] [ref=f1e103]
        - paragraph [ref=f1e104]: The agent creates an editable HTML CV and a role-specific cover letter using only verified information.
      - article [ref=f1e105]:
        - generic [ref=f1e106]: "04"
        - heading "Review before release" [level=3] [ref=f1e107]
        - paragraph [ref=f1e108]: Complete one CV review and three cover-letter loops. The local SOP then verifies the current files.
