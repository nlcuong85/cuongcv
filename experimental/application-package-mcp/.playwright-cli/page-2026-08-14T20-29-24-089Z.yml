  - generic [ref=f1e113]:
    - generic [ref=f1e114]: Hard local gates
    - heading "The documents do not become “ready” just because a chat says so." [level=2] [ref=f1e115]
    - paragraph [ref=f1e116]: The local Application SOP records the current artifact, review history, and release state. It catches edits made after review instead of treating an old approval as permanent.
    - generic [ref=f1e117]:
      - article [ref=f1e118]:
        - text: CV
        - heading "One review loop" [level=3] [ref=f1e119]
        - paragraph [ref=f1e120]: Review the editable CV against the job and visual structure. If you accept a known weakness, it is recorded clearly; otherwise the agent explains what needs fixing.
      - article [ref=f1e121]:
        - text: Cover letter
        - heading "Three distinct loops" [level=3] [ref=f1e122]
        - paragraph [ref=f1e123]: Each loop requires a current draft and a real revision record. The local SOP releases the letter only after it can verify all three loops against the latest file.
