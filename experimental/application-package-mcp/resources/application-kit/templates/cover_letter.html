<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@@COMPANY_NAME@@ Cover Letter</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-Bold.ttf") format("truetype");
        font-weight: 700;
      }

      :root {
        --ink: #1f2933;
        --muted: #52606d;
        --paper: #fffdf8;
      }

      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 36mm 20mm 18mm 25mm;
        background: var(--paper);
        box-sizing: border-box;
      }

      .sender-row {
        display: flex;
        justify-content: flex-end;
        font-size: 12px;
        color: var(--muted);
      }

      .sender {
        text-align: right;
      }

      .recipient-row {
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted);
      }

      .date-line {
        margin-top: 6px;
        text-align: right;
      }

      .subject {
        margin-top: 14px;
        font-weight: 700;
        font-size: 13px;
      }

      .salutation {
        margin-top: 14px;
      }

      .paragraph {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.33;
      }

      .signature-block {
        margin-top: 14px;
        white-space: pre-line;
      }

      .signature-image {
        display: block;
        width: 62mm;
        height: auto;
        margin: 6px 0 4px;
      }

      .enclosure {
        margin-top: 10px;
      }

      .enclosure ul {
        margin: 4px 0 0 18px;
        padding: 0;
        font-size: 11px;
      }

      .enclosure li + li {
        margin-top: 2px;
      }

      @page { size: A4; margin: 0; }
      @media print {
        body { background: #fff; }
        .page { width: 210mm; min-height: 297mm; margin: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="sender-row">
        <div class="sender">@@SENDER_BLOCK@@</div>
      </section>
      <section class="recipient-row">
        <div class="recipient">@@RECIPIENT_BLOCK@@</div>
      </section>
      <div class="date-line">@@DATE_LINE@@</div>
      <div class="subject">@@SUBJECT_LINE@@</div>
      <div class="salutation">@@SALUTATION@@</div>
      <div class="paragraph">@@OPENING_PARAGRAPH@@</div>
      <div class="paragraph">@@BODY_PARAGRAPH_ONE@@</div>
      <div class="paragraph">@@BODY_PARAGRAPH_TWO@@</div>
      <div class="paragraph">@@MOTIVATION_PARAGRAPH@@</div>
      <div class="paragraph">@@CLOSING_PARAGRAPH@@</div>
      <div class="signature-block">Best regards,
        @@SIGNATURE_IMAGE@@
@@SIGNATURE_NAME@@</div>
      <div class="enclosure"><strong>Enclosure:</strong>
        <ul>
          @@ENCLOSURE_ITEMS@@
        </ul>
      </div>
    </main>
  </body>
</html>
