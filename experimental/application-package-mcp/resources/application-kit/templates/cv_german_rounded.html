<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>@@NAME@@ - Lebenslauf</title>
    <style>
      @page { size: A4; margin: 0; }
      :root { --ink:#101010; --muted:#e7e7e7; --bar:#242424; --paper:#fff; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f4f4; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
      .page { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 13mm 14mm 15mm; background: var(--paper); }
      .name { margin: 0 0 -3.5mm; text-align: center; font-size: 34pt; line-height: 1; font-weight: 400; letter-spacing: -0.02em; }
      .hero { display: grid; grid-template-columns: 1fr 31mm; gap: 10mm; align-items: center; min-height: 39mm; margin-top: 0; padding: 11mm 12mm 10mm; border-radius: 8mm; background: var(--muted); }
      .summary { margin: 0; font-size: 11.4pt; line-height: 1.28; text-align: justify; }
      .summary strong { font-weight: 700; }
      .photo-frame { width: 31mm; height: 31mm; border: 1.1mm solid #fff; border-radius: 50%; overflow: hidden; background: #d4d4d4; margin: 0; }
      .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .contact-bar { width: 168mm; min-height: 10.5mm; margin: -4.4mm auto 9mm; padding: 2.6mm 7mm; border-radius: 2mm; display: grid; grid-template-columns: 1fr 1.2fr 1.35fr; gap: 4mm; background: var(--bar); color: #fff; text-align: center; font-size: 10.8pt; line-height: 1.15; }
      .contact-bar span { min-width: 0; overflow-wrap: anywhere; }
      .contact-bar a { color: #fff; text-decoration: underline; text-underline-offset: 1.5px; }
      .section { margin-top: 4.5mm; }
      .section-title { margin: 0 0 3.8mm; padding-bottom: 1.3mm; border-bottom: 0.35mm solid var(--ink); text-align: center; font-size: 21pt; line-height: 1; font-weight: 400; }
      .entry { margin: 0 0 2.6mm; }
      .entry-title { margin: 0; font-size: 11.7pt; line-height: 1.15; font-weight: 700; text-transform: uppercase; }
      .entry-subtitle { margin: 0.4mm 0 0.8mm; font-size: 11.7pt; line-height: 1.15; font-weight: 700; text-transform: uppercase; }
      ul { margin: 0 0 0 9mm; padding: 0; }
      li { margin: 0.45mm 0; padding-left: 3mm; font-size: 10.4pt; line-height: 1.2; }
      .skills-list, .language-list { margin-left: 0; list-style-position: inside; }
      .education-line { margin: 0; font-size: 11.5pt; line-height: 1.25; }
      @media screen { .page { box-shadow: 0 18px 45px rgba(0,0,0,.12); } }
      @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; } }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 class="name" contenteditable="true">@@NAME@@</h1>
      <section class="hero" aria-label="Profil">
        <p class="summary" contenteditable="true">@@SUMMARY@@</p>
        @@PHOTO_HTML@@
      </section>
      <section class="contact-bar" aria-label="Kontakt">
        <span contenteditable="true">@@PHONE@@</span>
        <span contenteditable="true">@@EMAIL@@</span>
        <span contenteditable="true">@@LINKEDIN@@</span>
      </section>
      <section class="section">
        <h2 class="section-title">Berufliche Erfahrungen</h2>
        @@EXPERIENCE_HTML@@
      </section>
      <section class="section">
        <h2 class="section-title">Kenntnisse &amp; Fähigkeiten</h2>
        <ul class="skills-list">@@SKILLS_HTML@@</ul>
      </section>
      <section class="section">
        <h2 class="section-title">Ausbildung</h2>
        @@EDUCATION_HTML@@
      </section>
      <section class="section">
        <h2 class="section-title">Sprachen</h2>
        <ul class="language-list">@@LANGUAGES_HTML@@</ul>
      </section>
    </main>
  </body>
</html>
