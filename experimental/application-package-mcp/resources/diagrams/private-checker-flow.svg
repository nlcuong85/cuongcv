" textLength="336.0449" x="79.272" y="552.0918">Release only when local SOP verifies current evidence</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="502.1924" y1="565.834" y2="565.834"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.5464" x="15" y="576.4688">[Other writing]</text><g class="message" data-participant-1="Agent" data-participant-2="Candidate"><polygon fill="#167766" points="78.272,597.0996,68.272,601.0996,78.272,605.0996,74.272,601.0996" style="stroke:#167766;stroke-width:1;"/><line style="stroke:#167766;stroke-width:1;stroke-dasharray:2,2;" x1="72.272" x2="426.3169" y1="601.0996" y2="601.0996"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.7861" x="114.9014" y="596.3574">Return local revision with clear limitations</text></g><rect fill="none" height="42.9766" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="637.1426" x="481.6309" y="721.0762"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="592.6621" x="486.6309" y="739.6113">Full workspace remains local: CV, notes, job files, drafts, PDFs, photos, and signatures.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="627.1426" x="486.6309" y="756.0996">Only selected text is submitted. The server returns feedback, never its private checker logic.</text><!--SRC=[TLLBRnen4BxxLupIGm-5j2Hf4b6f4e6iL2bL48bwwiLuXzqfnjxQtf2qwd_lsFi08d91u7bztpSFtiEZamhbaZI5bx5u3qDmwFaNcZ2KLQL9oK3M33UgOillcXnksER7i1Xz7Yv6rmDOd5qC5sVN8b3G27D7Jp8WFA165J0VFk9pW0K-4Mw5y6iobNHo0qkfreMpjScdLbi7xx8ikxwTx7buBeT68VmL01FdxBRr75rUNLrUykCThV2E3DvObwDhhRDiTd4psxSUgJJBhjXZBbqWHPKquI35wEmyEt_jy3hBxJIxpIuEdJ9hGfVZQdJ-AMFpZNq-ZYyQte3sRq-696jC_41_4Cu-7L7eEtel2vneAWmeRWyw8QGAdF5aAarEENVa1AI7_fTOskSz8sXP1LkTz0Yg7IaukRDAQfXy0ovYGaeqYTy4XygbzDYvRArR-uedwgUP_XW0DpsF-0Rmoou7a3kv2Zw