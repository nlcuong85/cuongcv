      - article [ref=e93]:
        - generic [ref=e94]: "01"
        - heading "Check the workspace" [level=3] [ref=e95]
        - paragraph [ref=e96]: The local SOP checks folder health, updates, and anything that may be making an old workspace slow.
      - article [ref=e97]:
        - generic [ref=e98]: "02"
        - heading "Add your evidence" [level=3] [ref=e99]
        - paragraph [ref=e100]: Bring your CV, role or job description, personal work bullets, and any writing samples that sound like you.
      - article [ref=e101]:
        - generic [ref=e102]: "03"
        - heading "Tailor locally" [level=3] [ref=e103]
        - paragraph [ref=e104]: The agent creates an editable HTML CV and a role-specific cover letter using only verified information.
      - article [ref=e105]:
        - generic [ref=e106]: "04"
        - heading "Review before release" [level=3] [ref=e107]
        - paragraph [ref=e108]: Complete one CV review and three cover-letter loops. The local SOP then verifies the current files.
