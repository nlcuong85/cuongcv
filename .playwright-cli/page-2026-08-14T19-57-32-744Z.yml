  - generic [ref=e42]:
    - generic [ref=e43]: What the helper actually does
    - heading "It makes the preparation process visible, not mysterious." [level=2] [ref=e44]
    - paragraph [ref=e45]: "The local AI agent acts like a calm career coach: it explains the best next step, asks for missing evidence, and says plainly when a document is still not ready. It never invents work experience or promises an application outcome."
    - generic [ref=e46]:
      - generic [ref=e47]:
        - generic [ref=e48]: Workspace health
        - paragraph [ref=e49]: Every supported workflow starts with a privacy-safe manifest audit. Older folders can be diagnosed for drift, duplicate material, and slow stages before any migration is approved.
      - generic [ref=e50]:
        - generic [ref=e51]: Evidence, not generic claims
        - paragraph [ref=e52]: For each employer, the agent recommends at least 10 personal bullets—15 is even better—then selects the best verified four or five for a job.
      - generic [ref=e53]:
        - generic [ref=e54]: Editable HTML CV
        - paragraph [ref=e55]: Bring a PDF, DOCX, or HTML CV. The original stays safe; the working CV becomes editable HTML, with a PDF derivative when available.
      - generic [ref=e56]:
        - generic [ref=e57]: Voice and supporting material
        - paragraph [ref=e58]: Writing samples and supporting documents are optional but improve accuracy. If you skip them, the agent explains the tradeoff instead of pretending the result is equally personal.
      - generic [ref=e59]:
        - generic [ref=e60]: Photo and signature choices
        - paragraph [ref=e61]: The agent asks about a CV photo and a cover-letter signature. Provide them if you want; decline or defer them and the workflow still continues honestly.
      - generic [ref=e62]:
        - generic [ref=e63]: Selected-text feedback
        - paragraph [ref=e64]: The private MCP checker receives only text you deliberately choose to review. It returns high-level guidance; its private rules never go into your workspace.
  - generic [ref=e65]:
    - generic [ref=e66]: The real workflow
    - heading "Four simple steps. Your files never leave your laptop." [level=2] [ref=e67]
    - paragraph [ref=e68]: The local agent manages the work in your own folder. The public service cannot browse it; it only receives a privacy-safe structure check or text you actively choose to review.
    - generic "Four-step application workflow" [ref=e69]:
      - article [ref=e70]:
        - generic [ref=e71]: "01"
        - heading "Check the workspace" [level=3] [ref=e72]
        - paragraph [ref=e73]: The local SOP checks folder health, updates, and anything that may be making an old workspace slow.
      - article [ref=e74]:
        - generic [ref=e75]: "02"
        - heading "Add your evidence" [level=3] [ref=e76]
        - paragraph [ref=e77]: Bring your CV, role or job description, personal work bullets, and any writing samples that sound like you.
      - article [ref=e78]:
        - generic [ref=e79]: "03"
        - heading "Tailor locally" [level=3] [ref=e80]
        - paragraph [ref=e81]: The agent creates an editable HTML CV and a role-specific cover letter using only verified information.
      - article [ref=e82]:
        - generic [ref=e83]: "04"
        - heading "Review before release" [level=3] [ref=e84]
        - paragraph [ref=e85]: Complete one CV review and three cover-letter loops. The local SOP then verifies the current files.
