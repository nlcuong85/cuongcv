  - generic [ref=e90]:
    - generic [ref=e91]: Hard local gates
    - heading "The documents do not become “ready” just because a chat says so." [level=2] [ref=e92]
    - paragraph [ref=e93]: The local Application SOP records the current artifact, review history, and release state. It catches edits made after review instead of treating an old approval as permanent.
    - generic [ref=e94]:
      - article [ref=e95]:
        - text: CV
        - heading "One review loop" [level=3] [ref=e96]
        - paragraph [ref=e97]: Review the editable CV against the job and visual structure. If you accept a known weakness, it is recorded clearly; otherwise the agent explains what needs fixing.
      - article [ref=e98]:
        - text: Cover letter
        - heading "Three distinct loops" [level=3] [ref=e99]
        - paragraph [ref=e100]: Each loop requires a current draft and a real revision record. The local SOP releases the letter only after it can verify all three loops against the latest file.
