  - generic [ref=e42]:
    - generic [ref=e43]: What the helper actually does
    - heading "It makes the preparation process visible, not mysterious." [level=2] [ref=e44]
    - paragraph [ref=e45]: "The local AI agent acts like a calm career coach: it explains the best next step, asks for missing evidence, and says plainly when a document is still not ready. It never invents work experience or promises an application outcome."
    - generic [ref=e46]:
      - generic [ref=e47]:
        - generic [ref=e48]: Workspace health
        - paragraph [ref=e49]: Every supported workflow starts with a privacy-safe manifest audit. Older folders can be diagnosed for drift, duplicate material, and slow stages before any migration is approved.
      - generic [ref=e50]:
        - generic [ref=e51]: Evidence, not generic claims
        - paragraph [ref=e52]: For each employer, the agent recommends at least 10 personal bullets—15 is even better—then selects the best verified four or five for a job.
      - generic [ref=e53]:
        - generic [ref=e54]: Editable HTML CV
        - paragraph [ref=e55]: Bring a PDF, DOCX, or HTML CV. The original stays safe; the working CV becomes editable HTML, with a PDF derivative when available.
      - generic [ref=e56]:
        - generic [ref=e57]: Voice and supporting material
        - paragraph [ref=e58]: Writing samples and supporting documents are optional but improve accuracy. If you skip them, the agent explains the tradeoff instead of pretending the result is equally personal.
      - generic [ref=e59]:
        - generic [ref=e60]: Photo and signature choices
        - paragraph [ref=e61]: The agent asks about a CV photo and a cover-letter signature. Provide them if you want; decline or defer them and the workflow still continues honestly.
      - generic [ref=e62]:
        - generic [ref=e63]: Selected-text feedback
        - paragraph [ref=e64]: The private MCP checker receives only text you deliberately choose to review. It returns high-level guidance; its private rules never go into your workspace.
  - generic [ref=e65]:
    - generic [ref=e66]: The real workflow
    - heading "Your files stay local. The quality process stays accountable." [level=2] [ref=e67]
    - paragraph [ref=e68]: This is the full path for a job application. The public service cannot browse your files; the local agent creates a minimal manifest for structure and version checks instead.
    - generic [ref=e69]:
      - img "Sequence diagram showing the candidate, local AI agent, local application SOP, local files, and the public MCP working together" [ref=e71]
      - generic [ref=e72]:
        - generic [ref=e73]:
          - strong [ref=e74]: Start with what you have
          - paragraph [ref=e75]: CV (PDF, DOCX, or HTML), role/JD, and your own evidence are the minimum useful starting point.
        - generic [ref=e76]:
          - strong [ref=e77]: Measure old folders first
          - paragraph [ref=e78]: If a package takes too long, diagnosis records timing and structure problems before anyone changes protected files.
        - generic [ref=e79]:
          - strong [ref=e80]: Keep choice with the candidate
          - paragraph [ref=e81]: The agent can recommend stronger inputs and flag risk, but you decide whether to provide optional material or continue with an informed tradeoff.
        - link "Open technical flow and PlantUML source" [ref=e82] [cursor=pointer]:
          - /url: /technical-flow
  - generic [ref=e83]:
    - generic [ref=e84]: Hard local gates
    - heading "The documents do not become “ready” just because a chat says so." [level=2] [ref=e85]
    - paragraph [ref=e86]: The local Application SOP records the current artifact, review history, and release state. It catches edits made after review instead of treating an old approval as permanent.
    - generic [ref=e87]:
      - article [ref=e88]:
        - text: CV
        - heading "One review loop" [level=3] [ref=e89]
        - paragraph [ref=e90]: Review the editable CV against the job and visual structure. If you accept a known weakness, it is recorded clearly; otherwise the agent explains what needs fixing.
      - article [ref=e91]:
        - text: Cover letter
        - heading "Three distinct loops" [level=3] [ref=e92]
        - paragraph [ref=e93]: Each loop requires a current draft and a real revision record. The local SOP releases the letter only after it can verify all three loops against the latest file.
