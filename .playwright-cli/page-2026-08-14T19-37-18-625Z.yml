  - heading "Student Application AI Helper Prompts" [level=1] [ref=f1e20]
  - paragraph [ref=f1e21]: Use these prompts with your local AI agent. Your private sources remain on your own computer; the MCP provides the workspace kit, safe structure/version advice, and optional selected-text feedback.
  - paragraph [ref=f1e22]: "Connection address:"
  - code [ref=f1e24]: https://jobmcp.pmlecuong.com/mcp
  - heading "1. Start A New Application Workspace" [level=2] [ref=f1e25]
  - code [ref=f1e27]: Set up my Student Application AI Helper workspace and explain the process as a practical career coach. First fetch the latest workspace and application kit from the MCP. Run the strict local SOP boot and create a privacy-safe workspace manifest. Ask the MCP to audit that manifest and tell me whether the workspace is current. Then show me a short checklist of what I already have, what is missing, and the single best next action. Keep my CV, job files, evidence, photos, signatures, drafts, and final outputs local.
  - heading "2. Diagnose My Old Or Slow Workspace" [level=2] [ref=f1e28]
  - code [ref=f1e30]: My Student Application AI Helper folder has been used for a while and the process feels slow. Do not assume the cause. Run the local workspace diagnosis first and measure file inventory, duplicate/stale material, protected sources, structure drift, and stage timings. Compare the result with the current ideal workspace structure. Give me a plain-language report explaining what is slowing the work down and a copy-first migration plan. Do not delete, overwrite, move, or migrate anything until I approve the plan.
  - heading "3. Prepare My Evidence Before Drafting" [level=2] [ref=f1e31]
  - code [ref=f1e33]: Help me prepare an honest application profile before drafting. Ask for my target role and job description or URL. Ask me to provide my current CV as PDF, DOCX, or HTML; keep the original in candidate/source. For each company in my experience, list the employer and ask me to write at least 10 authentic achievement/work bullets myself (15 is even better). Remind me not to use AI to invent these bullets. Invite supporting documents and real writing samples, explain what they improve, and record if I choose a generic voice instead. Ask whether I want to provide a CV photo. Ask for a signature image for the cover letter, but continue if I do not have one.
  - heading "4. Create A Tailored Editable CV" [level=2] [ref=f1e34]
  - code [ref=f1e36]: Create a tailored CV for jobs/<job-folder> using only verified local evidence. Preserve my original CV source and inspect its visual structure before generating an editable HTML CV. Use four or five of my verified bullets per employer that best match this job description. Do not add skills or achievements I cannot prove. Put unsupported JD requirements into a gap report, not into my CV. Show me the HTML CV, any PDF derivative, and a clear quality report. Run the one mandatory CV review loop and tell me exactly what is still weak before I decide to proceed.
  - heading "5. Create A Cover Letter With The Three-Loop Gate" [level=2] [ref=f1e37]
  - code [ref=f1e39]: Create a one-page cover letter for jobs/<job-folder> from my verified local evidence and writing voice. Use my signature if I provided one; otherwise continue and record that no signature is available. Run three separate review and revision loops. In every loop, show the current draft, what changed, and any remaining weak or unsupported point. For any private writing check, submit only the selected cover-letter text, never my whole CV, workspace, or job folder. Do not call the cover letter ready until the local SOP verifies three distinct current review records and creates a release receipt.
  - heading "6. Use My Current CV Without Extra Curation" [level=2] [ref=f1e40]
  - code [ref=f1e42]: I want to proceed using my current CV instead of writing a new employer bullet inventory. Record that I am choosing this shortcut and explain the likely tradeoff for role matching. Still use only verified information, tailor the ordering and emphasis honestly, run the required CV review, and remind me later that a personal bullet inventory would improve future applications.
  - heading "7. Review Selected Text Only" [level=2] [ref=f1e43]
  - code [ref=f1e45]: "Review this selected text with the MCP writing checker. Mode: application. Tell me what is generic, unsupported, overly polished, unclear, or weak for a recruiter. Return a practical revision plan first. Do not treat the result as proof of authorship or as a way to bypass AI detection. Revise the local file without inventing facts."
  - heading "8. Check For A Safe Kit Update" [level=2] [ref=f1e46]
  - code [ref=f1e48]: Run the privacy-safe workspace manifest audit before we start work. If the kit is current, continue without changing files. If an update is available, show me exactly which generic kit files would change. Do not overwrite my candidate sources, profile, voice samples, job folders, drafts, outputs, photos, signatures, or SOP history without my approval.
  - heading "Simple Rule" [level=2] [ref=f1e49]
  - code [ref=f1e51]: My application evidence stays local. The MCP sees only a privacy-safe folder manifest or text I deliberately select for review. The local SOP—not a chat promise—records whether CV and cover-letter gates are complete.
