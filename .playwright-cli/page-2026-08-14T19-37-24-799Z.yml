  - generic [ref=f2e42]:
    - generic [ref=f2e43]: What the helper actually does
    - heading "It makes the preparation process visible, not mysterious." [level=2] [ref=f2e44]
    - paragraph [ref=f2e45]: "The local AI agent acts like a calm career coach: it explains the best next step, asks for missing evidence, and says plainly when a document is still not ready. It never invents work experience or promises an application outcome."
    - generic [ref=f2e46]:
      - generic [ref=f2e47]:
        - generic [ref=f2e48]: Workspace health
        - paragraph [ref=f2e49]: Every supported workflow starts with a privacy-safe manifest audit. Older folders can be diagnosed for drift, duplicate material, and slow stages before any migration is approved.
      - generic [ref=f2e50]:
        - generic [ref=f2e51]: Evidence, not generic claims
        - paragraph [ref=f2e52]: For each employer, the agent recommends at least 10 personal bullets—15 is even better—then selects the best verified four or five for a job.
      - generic [ref=f2e53]:
        - generic [ref=f2e54]: Editable HTML CV
        - paragraph [ref=f2e55]: Bring a PDF, DOCX, or HTML CV. The original stays safe; the working CV becomes editable HTML, with a PDF derivative when available.
      - generic [ref=f2e56]:
        - generic [ref=f2e57]: Voice and supporting material
        - paragraph [ref=f2e58]: Writing samples and supporting documents are optional but improve accuracy. If you skip them, the agent explains the tradeoff instead of pretending the result is equally personal.
      - generic [ref=f2e59]:
        - generic [ref=f2e60]: Photo and signature choices
        - paragraph [ref=f2e61]: The agent asks about a CV photo and a cover-letter signature. Provide them if you want; decline or defer them and the workflow still continues honestly.
      - generic [ref=f2e62]:
        - generic [ref=f2e63]: Selected-text feedback
        - paragraph [ref=f2e64]: The private MCP checker receives only text you deliberately choose to review. It returns high-level guidance; its private rules never go into your workspace.
  - generic [ref=f2e65]:
    - generic [ref=f2e66]: The real workflow
    - heading "Your files stay local. The quality process stays accountable." [level=2] [ref=f2e67]
    - paragraph [ref=f2e68]: This is the full path for a job application. The public service cannot browse your files; the local agent creates a minimal manifest for structure and version checks instead.
    - generic [ref=f2e69]:
      - img "Sequence diagram showing the candidate, local AI agent, local application SOP, local files, and the public MCP working together" [ref=f2e71]
      - generic [ref=f2e72]:
        - generic [ref=f2e73]:
          - strong [ref=f2e74]: Start with what you have
          - paragraph [ref=f2e75]: CV (PDF, DOCX, or HTML), role/JD, and your own evidence are the minimum useful starting point.
        - generic [ref=f2e76]:
          - strong [ref=f2e77]: Measure old folders first
          - paragraph [ref=f2e78]: If a package takes too long, diagnosis records timing and structure problems before anyone changes protected files.
        - generic [ref=f2e79]:
          - strong [ref=f2e80]: Keep choice with the candidate
          - paragraph [ref=f2e81]: The agent can recommend stronger inputs and flag risk, but you decide whether to provide optional material or continue with an informed tradeoff.
        - link "Open technical flow and PlantUML source" [ref=f2e82] [cursor=pointer]:
          - /url: /technical-flow
  - generic [ref=f2e83]:
    - generic [ref=f2e84]: Hard local gates
    - heading "The documents do not become “ready” just because a chat says so." [level=2] [ref=f2e85]
    - paragraph [ref=f2e86]: The local Application SOP records the current artifact, review history, and release state. It catches edits made after review instead of treating an old approval as permanent.
    - generic [ref=f2e87]:
      - article [ref=f2e88]:
        - text: CV
        - heading "One review loop" [level=3] [ref=f2e89]
        - paragraph [ref=f2e90]: Review the editable CV against the job and visual structure. If you accept a known weakness, it is recorded clearly; otherwise the agent explains what needs fixing.
      - article [ref=f2e91]:
        - text: Cover letter
        - heading "Three distinct loops" [level=3] [ref=f2e92]
        - paragraph [ref=f2e93]: Each loop requires a current draft and a real revision record. The local SOP releases the letter only after it can verify all three loops against the latest file.
