    - heading "Four simple steps. Your files never leave your laptop." [level=2] [ref=e89]
    - paragraph [ref=e90]: The local agent manages the work in your own folder. The public service cannot browse it; it only receives a privacy-safe structure check or text you actively choose to review.
    - generic "Four-step application workflow" [ref=e91]:
      - article [ref=e92]:
        - generic [ref=e93]: "01"
        - heading "Check the workspace" [level=3] [ref=e94]
        - paragraph [ref=e95]: The local SOP checks folder health, updates, and anything that may be making an old workspace slow.
      - article [ref=e96]:
        - generic [ref=e97]: "02"
        - heading "Add your evidence" [level=3] [ref=e98]
        - paragraph [ref=e99]: Bring your CV, role or job description, personal work bullets, and any writing samples that sound like you.
      - article [ref=e100]:
        - generic [ref=e101]: "03"
        - heading "Tailor locally" [level=3] [ref=e102]
        - paragraph [ref=e103]: The agent creates an editable HTML CV and a role-specific cover letter using only verified information.
      - article [ref=e104]:
        - generic [ref=e105]: "04"
        - heading "Review before release" [level=3] [ref=e106]
        - paragraph [ref=e107]: Complete one CV review and three cover-letter loops. The local SOP then verifies the current files.
